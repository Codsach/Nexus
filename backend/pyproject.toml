[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "aiosqlite==0.20.0",
    "greenlet==3.1.1",
    "chromadb==0.5.18",
    "sentence-transformers==3.1.1",
    "httpx==0.27.2",
    "python-multipart==0.0.12",
    "python-dotenv==1.0.1",
    "sse-starlette==2.1.3",
    "anyio==4.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
